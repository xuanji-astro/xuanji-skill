<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fbf6ef">
<title>玄玑 · 命盘报告</title>
<!-- 玄玑 Skill 报告模板 v0.3：上篇命理师文章、下篇盘面审计。盘面、判词、应期由接口原样填入（profile.method），模型只写解读文字。本页不联网、不加载任何外部资源。 -->
<style>
:root{
  --bg:#fbf6ef;--card:#fffdfa;--card2:#fbf3e8;
  --ink:#3b2e26;--body:#4f4036;--sub:#8b7565;--faint:#b09c8c;
  --line:rgba(214,178,128,.42);--line2:rgba(212,160,100,.7);
  --accent:#c9783a;--accent2:#e58c4c;--soft:#fde6cf;--lav:#6f74c4;--lavsoft:#eceafb;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Source Han Serif CN","SimSun",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--body);min-height:100vh;background:
  radial-gradient(900px 480px at 50% -160px,#fff 0%,transparent 70%),
  radial-gradient(700px 520px at 100% 30%,rgba(196,186,250,.22),transparent 70%),
  radial-gradient(700px 520px at 0% 70%,rgba(253,214,180,.28),transparent 70%),
  linear-gradient(180deg,#fffdf9 0%,#fbf4ea 55%,#f8f2f6 100%);
  font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:44px 16px 72px}
p{margin:0 0 .7em}
strong{color:var(--ink);font-weight:600;background:linear-gradient(transparent 60%,var(--soft) 0)}
.serif{font-family:var(--serif)}

/* 抬头 */
.brand{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:12px;letter-spacing:.32em}
.brand i{display:block;width:26px;height:1px;background:var(--line2)}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.35;margin:14px 0 6px;letter-spacing:.04em;color:var(--ink)}
.meta{color:var(--sub);font-size:13.5px}
.tags{margin-top:14px}
.timenote{margin-top:10px;font-size:13.5px;color:var(--sub);padding-left:12px;border-left:2px solid var(--line2)}
.timenote:empty{display:none}
.timenote.warn{border-left-color:#ee9a7c}

/* 一句话 */
.hero{margin:30px 0 8px;padding:26px 22px 22px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(150deg,#fff 0%,#fff6ec 55%,#f3f0fd 100%);box-shadow:0 6px 24px rgba(190,140,90,.08)}
.headline{text-wrap:pretty;font-family:var(--serif);font-size:23px;line-height:1.65;color:var(--ink);margin:0 0 16px;letter-spacing:.02em}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12.5px;line-height:1;padding:7px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--body);background:rgba(255,255,255,.75);white-space:nowrap}
.tag b{color:var(--accent);font-weight:600;margin-left:4px}

/* 两张盘 */
.charts{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 6px}
@media(min-width:680px){.charts{grid-template-columns:1fr 1fr}}
.panel{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 14px 12px;box-shadow:0 4px 18px rgba(190,140,90,.06)}
.panel h4{margin:0 0 10px;font-weight:500;font-size:12.5px;color:var(--sub);letter-spacing:.18em}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pl{border-radius:12px;padding:8px 2px 10px}
.pl.me{background:#fff4e7;box-shadow:inset 0 0 0 1px var(--line2)}
.pl small{display:block;font-size:11px;color:var(--faint);line-height:1.6}
.pl .tg{font-size:11.5px;color:var(--sub);margin-top:2px}
.pl .gz{font-family:var(--serif);font-size:34px;line-height:1.18;font-weight:600}
.pl .hid{font-size:11px;color:var(--faint);margin-top:4px;letter-spacing:.06em}
.pl.none .gz{color:var(--faint);font-size:15px;line-height:2.6}
.wx{margin-top:14px}
.wxrow{display:grid;grid-template-columns:22px 1fr 38px;align-items:center;gap:8px;font-size:12.5px;margin:5px 0}
.wxrow .bar{height:7px;border-radius:9px;background:rgba(150,110,70,.09);overflow:hidden}
.wxrow .bar i{display:block;height:100%;border-radius:9px}
.wxrow .pc{color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.wheel{display:block;width:100%;max-width:400px;margin:0 auto}
.panel .empty{color:var(--faint);font-size:13px;padding:40px 6px;text-align:center}

/* 章节 */
section{margin-top:46px}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sh .no{font-size:12px;color:var(--accent);letter-spacing:.2em}
.sh h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;letter-spacing:.06em;color:var(--ink)}
.sh .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent);transform:translateY(-5px)}
.lead{font-size:15.5px}
.cards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 18px 10px;box-shadow:0 4px 18px rgba(190,140,90,.06)}
.card .lb{font-size:12px;color:var(--accent);letter-spacing:.16em}
.card .lb span{color:var(--faint);letter-spacing:.04em;margin-left:8px}
.card h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:6px 0 8px;line-height:1.5;color:var(--ink)}
.type{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--accent);letter-spacing:.08em;line-height:1.2;margin:6px 0 2px}
.sub2{font-size:12.5px;color:var(--sub);margin-bottom:8px}

/* 对照 */
.cx{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 18px 8px;margin-bottom:12px;box-shadow:0 4px 18px rgba(190,140,90,.05)}
.cx .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.cx h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;color:var(--ink)}
.badge{font-size:12px;line-height:1;padding:6px 10px;border-radius:999px;white-space:nowrap}
.badge.agree{color:#a85a22;background:var(--soft)}
.badge.differ{color:var(--lav);background:var(--lavsoft)}
.cx .row{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:14px;padding:5px 0;border-top:1px dashed rgba(150,110,70,.16)}
.cx .row span{color:var(--faint);font-size:12.5px;padding-top:1px}
.cx .note{font-size:13.5px;color:var(--sub);margin:8px 0 6px}

/* 运势 */
.luck{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 10px 10px;margin:4px 0 14px}
.luck svg{display:block;width:100%;height:auto}
.years{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 14px}
@media(min-width:620px){.years{grid-template-columns:repeat(10,1fr)}}
.yr{position:relative;overflow:hidden;border-radius:10px;padding:9px 2px 6px;text-align:center;font-size:11.5px;line-height:1.45;color:var(--sub);background:var(--card);border:1px solid var(--line)}
.yr>i{position:absolute;left:0;right:0;top:0;height:3px}
.yr b{display:block;font-size:12.5px;font-weight:600;color:var(--ink)}
.yr .tw{font-weight:600}
.yr.now{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--faint);margin:6px 4px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.next{margin-top:10px;padding:12px 16px;border-radius:12px;background:var(--card2);font-size:14.5px}
.next span{color:var(--accent);font-size:12.5px;letter-spacing:.12em;margin-right:8px}

/* 过去 */
.win{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;padding:14px 4px;border-top:1px solid rgba(150,110,70,.13)}
.win:first-of-type{border-top:0}
.win .y{font-family:var(--serif);font-size:20px;color:var(--accent);line-height:1.3}
.win p{margin:0;font-size:14.5px}
.fb{font-size:12px;line-height:1;padding:6px 9px;border-radius:999px;white-space:nowrap;margin-top:3px}
.fb.f1{background:#f8c79c;color:#7a3f14}.fb.f2{background:var(--soft);color:#a85a22}
.fb.f3{background:var(--lavsoft);color:var(--lav)}.fb.f0{border:1px dashed var(--line2);color:var(--faint)}
.winnote{font-size:13px;color:var(--faint);margin-top:6px}

/* 被看见 */
.seen{text-wrap:pretty;font-family:var(--serif);font-size:22px;line-height:1.7;color:var(--ink);text-align:center;padding:30px 10px 26px;margin:0}
.seen::before,.seen::after{content:"";display:block;width:44px;height:1px;margin:0 auto 18px;background:var(--line2)}
.seen::after{margin:18px auto 0}
.open{border:1px dashed rgba(111,116,196,.45);border-radius:16px;padding:14px 18px 8px;margin-top:8px;background:rgba(236,234,251,.35)}
.open .lb{font-size:12px;color:var(--lav);letter-spacing:.14em;margin-bottom:6px}

/* 接着问＋存档 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.chip{font-size:13.5px;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--body)}
.hint{font-size:13px;color:var(--faint)}
.btn{display:inline-block;margin:8px 0 4px;padding:11px 20px;border-radius:999px;background:linear-gradient(90deg,#f2a46c,#e2804a);color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;border:0;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(226,128,74,.25)}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line2);padding:8px 16px;font-size:13px;font-weight:500;box-shadow:none}

/* 依据 */
details.basis{margin-top:52px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
details.basis>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;font-family:var(--serif);font-size:17px;letter-spacing:.08em;color:var(--ink)}
details.basis>summary::-webkit-details-marker{display:none}
details.basis>summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
details.basis[open]>summary::after{transform:rotate(-135deg) translateY(-1px)}
details.basis>summary small{font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;color:var(--faint);letter-spacing:0;margin-left:10px}
.bd{padding:0 18px 14px;font-size:13.5px;color:var(--body)}
.bd h4{font-size:12.5px;color:var(--accent);letter-spacing:.16em;font-weight:500;margin:22px 0 8px}
.bd h4:first-child{margin-top:4px}
.bd ul{margin:0 0 6px;padding-left:18px}.bd li{margin:2px 0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px}
.kv dt{color:var(--faint)}.kv dd{margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid rgba(150,110,70,.12);text-align:center;font-weight:400}
.tbl th{color:var(--faint);font-size:12px}
.tbl td:first-child,.tbl th:first-child{text-align:left;color:var(--faint);white-space:nowrap;padding-right:8px}
.conf{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-bottom:6px}
.lv{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--soft);color:#a85a22;white-space:nowrap;height:fit-content;margin-top:2px}
.mini{display:flex;flex-wrap:wrap;gap:6px}.mini span{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--card2)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

footer{margin-top:44px;text-align:center;color:var(--faint);font-size:12px;line-height:1.9}
footer .motto{font-family:var(--serif);color:var(--accent);font-size:15px;letter-spacing:.3em;margin-bottom:8px}
.connect{margin:40px 0 0;text-align:center;padding:24px 16px 22px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.connect .ct{font-family:var(--serif);font-size:19px;color:var(--ink);letter-spacing:.14em;margin-bottom:16px}
.connect .qrw{display:inline-block;padding:12px;background:#fff;border-radius:14px;box-shadow:0 0 0 6px rgba(201,120,58,.10),0 0 30px rgba(229,140,76,.32)}
.connect .qr{display:block;width:180px;height:180px}
.connect .pill{display:inline-block;margin-top:16px;font-size:13px;color:var(--accent);border:1px solid var(--line2);border-radius:999px;padding:4px 14px;background:var(--card2)}
@media(max-width:420px){h1{font-size:26px}.headline{font-size:20px}.pl .gz{font-size:29px}.win{grid-template-columns:54px 1fr}.win .fb{grid-column:2;justify-self:start}}
@media print{details.basis{break-before:page}}
/* 存为 PDF（网页链接为主，PDF 方便留存；不做长图）：按钮走浏览器打印→「存为 PDF」；打印时折叠全部展开（按钮先展开，beforeprint 兜底），印完收回 */
.xj-pdf{position:absolute;top:12px;right:16px;font:inherit;font-size:12px;letter-spacing:.12em;color:var(--accent);background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.xj-pdf:active{opacity:.6}
@media print{
  @page{size:A4;margin:12mm 11mm}
  html,body{background:#fff !important}   /* 纸边是白的，整张都用白底，卡片照原色（不出米色框） */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .xj-pdf{display:none !important}
  .wrap{max-width:none;padding:0 0 8mm}
  .fold>summary::after,.basis>summary::after{display:none}
  .cover,.panel,.card,.cx,.luck,.next,.open,.connect,.years,svg,img,table,tr,figure{break-inside:avoid}
  h2,h3,h4,.pl2,.pt2,.divd,.sh,.subhead,.figt{break-after:avoid}
  .part{break-before:page;margin-top:0}   /* 每一篇从新的一页起，标题不会落在页底 */
  .connect{break-before:page}
}

/* 封面＝分享卡「玄玑看见的你」 */
.cover{margin:22px 0 26px;padding:28px 24px 20px;border-radius:22px;border:1px solid var(--line2);
  background:linear-gradient(155deg,#fff 0%,#fff3e6 48%,#eeeafd 100%);box-shadow:0 10px 30px rgba(190,140,90,.12)}
.cover .ct{font-size:12.5px;letter-spacing:.32em;color:var(--accent)}
.cover .cl{text-wrap:pretty;font-family:var(--serif);font-size:24px;line-height:1.7;color:var(--ink);margin:14px 0 12px;font-weight:600}
.cover .ce{font-size:13.5px;color:var(--sub);padding-left:10px;border-left:2px solid var(--line2)}
.cover .cf{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px;color:var(--faint)}
.cover .cf span{color:var(--lav);background:var(--lavsoft);padding:4px 10px;border-radius:999px}
.cover .cf b{font-family:var(--serif);color:var(--accent);letter-spacing:.2em;font-weight:600}

/* 认知进度 */
.prog{margin:18px 0 0;padding:14px 18px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.prog .pt{font-size:12.5px;color:var(--sub);letter-spacing:.14em;margin-bottom:6px}
.prog ul{list-style:none;margin:0;padding:0}
.prog li{display:flex;gap:10px;align-items:baseline;padding:4px 0;font-size:14.5px}
.prog li span{flex:none;font-size:12px;padding:2px 8px;border-radius:999px}
.prog .st-ok span{background:var(--soft);color:#a85a22}.prog .st-q span{background:var(--lavsoft);color:var(--lav)}.prog .st-w span{border:1px dashed var(--line2);color:var(--faint)}

/* 术语条 */
.termrow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.term{font-size:12.5px;line-height:1.3;padding:5px 10px;border-radius:8px;background:var(--card2);color:var(--body);border:1px solid rgba(214,178,128,.3)}
.term.big{font-family:var(--serif);font-weight:600;font-size:14px;color:#a85a22;background:var(--soft)}
.term.ok{color:#2f7d57;background:#e7f5ec;border-color:#cde9d8}.term.no{color:#b5503a;background:#fbe9e4;border-color:#f3d2c8}
.term.hard{color:#b5503a}.term.soft{color:#2f7d73}

/* 八字：日主＋格局 */
.idn{margin:4px 0 12px}
.idn-t{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.idn-s{font-size:14.5px;color:var(--body);margin-top:2px}.idn-s b{font-family:var(--serif);font-size:17px;color:#e0623f}
.idn-l{font-size:13.5px;color:var(--sub);margin-top:2px}
.gj .hm{font-family:var(--serif);font-size:17px;font-weight:600;color:#a85a22;margin:2px 0 6px}
.gj .gjn{font-size:13.5px;color:var(--sub)}
.gj .gjd{margin:8px 0 6px;color:var(--body)}
.ss .ssr{display:grid;grid-template-columns:40px 1fr 30px;align-items:center;gap:8px;margin:8px 0 0;font-size:13px}
.ss .ssr .bar{height:6px;border-radius:9px;background:rgba(150,110,70,.09);overflow:hidden}.ss .ssr .bar i{display:block;height:100%;background:linear-gradient(90deg,#f6b780,#e58c4c);border-radius:9px}
.ss .ssv{color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.ss .ssw{grid-column:2/4;font-size:12.5px;color:var(--sub);margin-top:-4px}
.ss .ssf{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(150,110,70,.18)}
.ss .ssfi{margin:6px 0 8px}.ss .ssfi b{font-family:var(--serif);color:var(--ink);margin-right:8px}.ss .ssfi span{color:#a85a22;font-size:13px}
.ss .ssfi p{font-size:12.5px;color:var(--sub);margin:2px 0 0}
.lucky{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub);margin-top:6px}.lucky b{color:var(--ink);font-weight:600}

/* 星盘：日月升＋逐星 */
.pgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:680px){.pgrid.two{grid-template-columns:1fr 1fr}}
.pcd{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 16px 8px;box-shadow:0 4px 18px rgba(190,140,90,.05)}
.pcd .ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pcd .pn{font-family:var(--serif);font-size:19px;font-weight:600}
.pcd .ps{font-size:13px;color:var(--sub)}
.pcd .ruler{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:#a85a22}
.pcd .termrow{margin:8px 0 6px}
.pcd p{font-size:14.5px}

/* 人格 */
.stack{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0 8px;font-size:13.5px}
.stack dt{color:var(--faint)}.stack dd{margin:0}.stack dd b{color:var(--ink);margin-right:6px}
.quote{font-family:var(--serif);font-size:15.5px;color:var(--ink);margin:8px 0 6px;padding-left:12px;border-left:2px solid var(--line2)}
.nb{font-size:13px;color:var(--sub);margin:4px 0 8px}
.rb{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media(min-width:620px){.rb{grid-template-columns:1fr 1fr}}
.rb .card h3{margin-bottom:2px}
.src{font-size:12.5px;color:var(--sub);margin:6px 0 8px}.src b{color:var(--ink);font-weight:600}

/* 大运判词 */
.lw{margin:0 0 12px;padding:14px 18px 10px;border-radius:16px;background:linear-gradient(150deg,#fff8ef,#fff);border:1px solid var(--line2)}
.lw .lwt{font-size:12.5px;color:var(--sub);letter-spacing:.08em}
.lw .lwh{font-family:var(--serif);font-size:19px;font-weight:600;color:#a85a22;margin:4px 0 2px;letter-spacing:.06em}
.lw p{margin:4px 0 4px;color:var(--body)}

/* 八个方面 */
.blk{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 18px 10px;margin-bottom:12px;box-shadow:0 4px 18px rgba(190,140,90,.05)}
.blk .bt{font-size:12.5px;color:var(--accent);letter-spacing:.16em}

function wheelPanel() {
  if (!W) return h('div', 'panel', [h('h4', null, '星盘'), h('div', 'empty', '没有出生时间，星盘的上升和宫位排不出来。')]);
  var asc = W.angles.asc.L, mc = W.angles.mc.L, s = '';
  var R0 = 190, R1 = 163, R2 = 145, RL = 124, RA = 98;
  var ELC = ['#d8432f', '#a8841c', '#3d8f4f', '#2f5fc4'];   // 火 土 风 水
  var RULE = [['火'], ['金'], ['水'], ['月'], ['日'], ['水'], ['金'], ['火', '冥'], ['木'], ['土'], ['土', '天'], ['木', '海']];
  var PC = { 太阳: '#d8432f', 月亮: '#2f5fc4', 水星: '#3d8f4f', 金星: '#a8841c', 火星: '#d8432f', 木星: '#d8432f', 土星: '#a8841c', 天王: '#3d8f4f', 海王: '#2f5fc4', 冥王: '#23366e', 凯龙: '#7a5fc4', 北交点: '#2a9d9d', 福点: '#2a9d9d', 升: '#d8432f', 中: '#3d8f4f' };
  function pol(L, r) { var t = (180 + (L - asc)) * Math.PI / 180; return [(200 + r * Math.cos(t)).toFixed(1), (200 - r * Math.sin(t)).toFixed(1)]; }
  function ang(a, b) { var d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }
  function line(p1, p2, st) { return '<line x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '" ' + st + '/>'; }
  function txt(p, t, st, dy) { return '<text x="' + p[0] + '" y="' + (+p[1] + (dy || 0)).toFixed(1) + '" text-anchor="middle" dominant-baseline="central" ' + st + '>' + t + '</text>'; }
  // 星座带：四象上色，旁边标守护星

  s += '<circle cx="200" cy="200" r="' + R1 + '" fill="#eef6fb" stroke="#d2ac63" stroke-width="1"/>';
  for (var i = 0; i < 12; i++) {
    s += line(pol(i * 30, R1), pol(i * 30, R0), 'stroke="#d2ac63" stroke-width="1"');
    var c = ELC[i % 4], rl = RULE[i];
    s += txt(pol(i * 30 + 15 + (rl.length > 1 ? 0 : -3), (R0 + R1) / 2), ZOD[i], 'font-size="15" font-weight="700" fill="' + c + '" font-family="Songti SC,STSong,serif"');
    if (rl.length > 1) {
      s += txt(pol(i * 30 + 5, (R0 + R1) / 2 - 2), rl[0], 'font-size="8.5" fill="' + c + '" opacity=".8"');
      s += txt(pol(i * 30 + 25, (R0 + R1) / 2 - 2), rl[1], 'font-size="8.5" fill="' + c + '" opacity=".8"');
    } else {
      s += txt(pol(i * 30 + 24, (R0 + R1) / 2 + 3), rl[0], 'font-size="8.5" fill="' + c + '" opacity=".8"');
    }
  }
  // 宫位带＋宫号；宫头线到相位圈是实线，圈里是虚线通到圆心
  s += '<circle cx="200" cy="200" r="' + R2 + '" fill="#fffefb" stroke="#8fb0cc" stroke-width="1"/>';
  var cusps = W.houses.map(lon);
  for (var k = 0; k < 12; k++) {
    var cu = cusps[k], axis = k === 0 || k === 3 || k === 6 || k === 9;
    if (!axis) {
      s += line(pol(cu, RA), pol(cu, R1), 'stroke="#8fb0cc" stroke-width="1"');
      s += line(pol(cu, 0), pol(cu, RA), 'stroke="#7f9fbd" stroke-width=".9" stroke-dasharray="2 3"');
    }
    var span = ((cusps[(k + 1) % 12] - cu) % 360 + 360) % 360;
    s += txt(pol(cu + span / 2, (R1 + R2) / 2), k + 1, 'font-size="10.5" font-weight="600" fill="#3a5a8c"');
  }
  // 相位圈

  var P = W.planets.map(function (p) { return { n: p.n, L: lon(p) }; });
  for (var a1 = 0; a1 < P.length; a1++) for (var b1 = a1 + 1; b1 < P.length; b1++) {
    var dd = ang(P[a1].L, P[b1].L), hit = null;
    for (var z = 0; z < ASPECTS.length; z++) if (Math.abs(dd - ASPECTS[z][0]) <= ASPECTS[z][2]) { hit = ASPECTS[z]; break; }
    if (!hit || hit[0] === 0) continue;
    var st = hit[0] === 180 ? 'stroke="#d8432f" stroke-width="1.1" opacity=".75"'
      : hit[0] === 90 ? 'stroke="#d8432f" stroke-width="1.1" stroke-dasharray="4 3" opacity=".75"'
      : hit[0] === 120 ? 'stroke="#2a9d8f" stroke-width="1.1" opacity=".8"'
      : 'stroke="#2a9d8f" stroke-width="1" stroke-dasharray="4 3" opacity=".75"';
    s += line(pol(P[a1].L, RA), pol(P[b1].L, RA), st);
  }
  // 两轴：上升—下降、天顶—天底，实线贯穿全盘
  s += line(pol(asc, R0 + 8), pol(asc + 180, R0 + 8), 'stroke="#3b6ea5" stroke-width="1.6"');
  s += line(pol(mc, R0 + 8), pol(mc + 180, R0 + 8), 'stroke="#3b6ea5" stroke-width="1.6"');
  // 天体：相位圈上的真实位置点＋点线＋彩色汉字，挤在一起的往两边推开
  var bodies = W.planets.map(function (p) { return { k: p.n, ch: CHAR[p.n], L: lon(p), rx: p.rx }; })
    .concat((W.points || []).filter(function (p) { return p.n === '北交点' || p.n === '福点'; }).map(function (p) { return { k: p.n, ch: p.n === '福点' ? '福' : '北', L: lon(p) }; }))
    .concat([{ k: '升', ch: '升', L: asc }, { k: '中', ch: '中', L: mc }]);
  var lab = bodies.map(function (x) { return { k: x.k, L: x.L, A: x.L }; }).sort(function (p, q) { return p.L - q.L; });
  for (var it = 0; it < 80; it++) {
    var moved = false;
    for (var j = 0; j < lab.length; j++) {
      var nb = lab[(j + 1) % lab.length], gap = j + 1 < lab.length ? nb.A - lab[j].A : nb.A + 360 - lab[j].A;
      if (gap < 9) { var push = (9 - gap) / 2 + 0.05; lab[j].A -= push; nb.A += push; moved = true; }
    }

  }
  var LBL = {}; lab.forEach(function (x) { LBL[x.k] = x.A; });
  bodies.forEach(function (x) {
    var col = PC[x.k] || '#6a6a8a', A = LBL[x.k], dot = pol(x.L, RA), lp = pol(A, RL);
    s += line(pol(x.L, RA + 2), pol(A, RL - 9), 'stroke="' + col + '" stroke-width=".8" stroke-dasharray="1.5 2" opacity=".8"');
    s += '<circle cx="' + dot[0] + '" cy="' + dot[1] + '" r="2.3" fill="' + col + '"/>';

  });
  return h('div', 'panel', [h('h4', null, '星盘 · 普拉西德分宫'), svg('-12 -12 424 424', 0, s, 'wheel')]);
}
